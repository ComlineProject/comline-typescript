[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Same revs `codegen` pins, so this tool and the generator it drives agree on
# one `comline-core` - see codegen/Cargo.toml's own comment.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "525939352b79538ce5e9b41ae6713ee6bd26a25e" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "1ddafd26b16dd11e3924724cf1cb1719c84fc979" }
comline-codegen-typescript = { path = "../codegen" }

eyre = "0.6.8"
